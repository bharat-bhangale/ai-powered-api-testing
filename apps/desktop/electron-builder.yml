appId: com.atx.desktop
productName: ATX Desktop
copyright: Copyright © 2026 Bharat Bhangale

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - resources/**/*
  - "!**/*.ts"
  - "!**/*.map"

# Include the built web frontend
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.png
  category: public.app-category.developer-tools

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: resources/icon.png
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: bharat-bhangale
  repo: ai-powered-api-testing
